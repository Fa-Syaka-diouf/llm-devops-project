apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: llm-devops
  labels:
    app.kubernetes.io/part-of: llm-devops-project
spec:
  ingressClassName: nginx
  rules:
    - host: llm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
