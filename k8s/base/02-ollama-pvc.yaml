apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: llm-devops
  labels:
    app.kubernetes.io/part-of: llm-devops-project
    app.kubernetes.io/name: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Holds downloaded model weights (llama3.2:3b ~2Gi + mistral:7b ~4.5Gi),
      # sized with headroom for additional models.
      storage: 15Gi
