apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-devops
  labels:
    app.kubernetes.io/part-of: llm-devops-project
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          envFrom:
            - configMapRef:
                name: llm-config
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "6"
              memory: "5Gi"
          # Model server takes longer to bind on first start than on later restarts;
          # startupProbe protects readiness/liveness from firing too early.
          startupProbe:
            httpGet:
              path: /api/version
              port: 11434
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
