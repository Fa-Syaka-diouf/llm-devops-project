apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lightweight environment for local iteration: lower resource footprint,
# separate namespace and hostname so it can coexist with prod on the
# same cluster without colliding.
namespace: llm-devops-dev

resources:
  - ../../base

patches:
  - path: ollama-resources-patch.yaml
    target:
      kind: Deployment
      name: ollama
  - path: ingress-host-patch.yaml
    target:
      kind: Ingress
      name: open-webui-ingress