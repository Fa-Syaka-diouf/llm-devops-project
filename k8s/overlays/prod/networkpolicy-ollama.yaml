# NOTE: NetworkPolicy is only ENFORCED by CNI plugins that implement it
# (Calico, Cilium, Weave...). Minikube's default CNI here is kindnet,
# which accepts these objects (they are valid Kubernetes API resources)
# but does not enforce them. This manifest is written for a
# production cluster running a policy-aware CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-allow-webui-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
      ports:
        - protocol: TCP
          port: 11434